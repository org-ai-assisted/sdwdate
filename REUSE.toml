version = 1

# Licensing layout: debian/copyright stays DEP-5; COPYING holds the verbatim
# AGPL text, duplicated into LICENSES/AGPL-3.0-or-later.txt as REUSE requires.
# Verbatim COPYING is needed because GitHub's licensee does not detect DEP-5
# (reports NOASSERTION; https://github.com/licensee/licensee/issues/333 ,
# wontfix) and does not yet detect a LICENSES/-only tree on github.com
# (https://github.com/licensee/licensee/pull/926 added it, but github.com
# ships a lagging build).
#
# sdwdate is single-license (AGPL-3.0-or-later), single copyright holder.
# Bulk-annotate every file; in-file "Copyright (C) ..." headers still apply
# (precedence = aggregate adds this holder, it does not replace them).
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2012 - 2025 ENCRYPTED SUPPORT LLC <adrelanos@whonix.org>"
SPDX-License-Identifier = "AGPL-3.0-or-later"
